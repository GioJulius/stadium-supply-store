<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <!--
      No `maximum-scale`: capping zoom stops anyone who needs to pinch in to
      read a size chart, and it fails WCAG 1.4.4.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stadium Supply — Football, collected.</title>
    <meta name="description" content="Football, rugby and F1 kits delivered anywhere in South Africa for a flat R100. Fan, player and retro versions, S to 5XL, with name, number and badge printing." />
    <link rel="canonical" href="https://stadiumsupply.co.za/" />
    <meta name="theme-color" content="#12192c" />

    <!--
      A club crest: the store's initial in Akira Expanded, the header lockup's
      own face, on a cream shield over the navy the theme colour already names.
      The stacked "Stadium / Supply" wordmark is unreadable at 16px — two lines
      of a very wide face leave each letter eight pixels tall — so the mark
      carries the S alone.

      favicon.svg draws the letter as an outline rather than setting it in
      type, so nothing here depends on the .otf loading. The .ico carries 16,
      32 and 48, and its 16 is drawn to its own slightly heavier geometry: at
      that size the shield's margin and the S's counter cannot both survive a
      straight downscale of the 512.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Almost every visit to this store starts as a link pasted into WhatsApp,
      Instagram or TikTok, and none of those scrapers run JavaScript. Whatever
      sits here is the whole preview, so it is filled in statically and then
      overwritten per product at build time by scripts/prerender-seo.mjs.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stadium Supply" />
    <meta property="og:title" content="Stadium Supply — Football, collected." />
    <meta property="og:description" content="Football, rugby and F1 kits delivered anywhere in South Africa for a flat R100. Fan, player and retro versions, S to 5XL." />
    <meta property="og:url" content="https://stadiumsupply.co.za/" />
    <meta property="og:image" content="https://stadiumsupply.co.za/media/share-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_ZA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stadium Supply — Football, collected." />
    <meta name="twitter:description" content="Football, rugby and F1 kits delivered anywhere in South Africa for a flat R100." />
    <meta name="twitter:image" content="https://stadiumsupply.co.za/media/share-card.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
